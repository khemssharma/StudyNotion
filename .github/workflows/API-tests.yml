name: Server API tests

# Gates the Server API tests check on every push/PR to main.
# The Express backend lives at the repo root (moved out of server/ during
# the backend-focused restructure) - run these steps from repo root, not
# a server/ subdirectory.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-server:
    name: Run server tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-server-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-server-

      - name: Install dependencies
        run: npm ci

      - name: Run server tests
        run: npm test
